name: Učení modelu (denně)
on:
  schedule:
    - cron: "30 2 * * *"   # 04:30 pražského letního času (03:30 v zimě)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: learn
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Historická data (cache, obnova týdně)
        uses: actions/cache@v4
        with: { path: data/raw/atp, key: "sackmann-atp-${{ github.run_number }}", restore-keys: "sackmann-atp-" }
      - uses: actions/cache@v4
        with: { path: data/raw/wta, key: "sackmann-wta-${{ github.run_number }}", restore-keys: "sackmann-wta-" }
      - run: python scripts/download_data.py
      - name: Aktuální model + průběžné výsledky
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/fetch_release.py
      - name: Nechat jen nejnovější Sackmann cache
        if: success()
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          python3 - << 'PY'
          import os, subprocess
          repo = os.environ["R"]
          for prefix in ("sackmann-atp-", "sackmann-wta-"):
              raw = subprocess.check_output(["gh", "cache", "list", "-R", repo, "--key", prefix, "--limit", "100", "--json", "id,key"], text=True)
              import json
              rows = []
              for row in json.loads(raw or "[]"):
                  tail = row["key"][len(prefix):]
                  num = tail.split("-", 1)[0]
                  if num.isdigit():
                      rows.append((int(num), row["id"]))
              rows.sort()
              for _, cid in rows[:-1]:
                  subprocess.call(["gh", "cache", "delete", str(cid), "-R", repo])
          PY
      - name: Ingest + přetrénování s bránou kvality
        working-directory: backend
        run: python retrain.py
      # Jen tenhle denní běh nahrává release `model`. Export každých 10 min ho nesmí přepisovat:
      # delete+reupload se trefuje do stahování a zápas se pak započte dvakrát, nebo vůbec.
      - name: Publikace (stav vždy, model jen když prošel bránou)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd data/model && tar czf ../../model.tar.gz gbm.txt logreg.pkl state.pkl matches.pkl metrics.json retrain_history.json && cd ../..
          gh release upload model model.tar.gz data/raw/live_results.csv --clobber -R "${{ github.repository }}"
          gh workflow run pages.yml -R "${{ github.repository }}"
