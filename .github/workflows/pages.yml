name: Predikce -> GitHub Pages
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub Pages má měkký limit ~10 nasazení/h; živé skóre jde z prohlížeče
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  # Bez cancel-in-progress: dva exporty za sebou se nesmí přerušit, jinak se ztratí dohraný zápas.
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Obnovit poslední celý model a state.json
        uses: actions/cache/restore@v4
        with:
          path: data/online-cache
          key: model-last-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            model-last-
      - name: Model z release, jinak záloha z cache
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/fetch_release.py
      - run: python scripts/export_static.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: Uložit zálohu modelu a state.json
        id: save_cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/online-cache
          key: model-last-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Smazat starší zálohy modelu
        if: steps.save_cache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: model-last-${{ github.run_id }}-${{ github.run_attempt }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Maže jen starší běh. Novější záloha (vyšší run id) musí přežít, když se dva exporty potkají.
          ME="${{ github.run_id }}"
          gh cache list -R "$R" --key model-last- --limit 100 --json id,key --jq '.[] | "\(.id)\t\(.key)"' |
            while IFS="$(printf '\t')" read -r id key; do
              num="${key#model-last-}"
              num="${num%%-*}"
              case "$num" in ''|*[!0-9]*) continue ;; esac
              [ "$num" -lt "$ME" ] || continue
              gh cache delete "$id" -R "$R" || true
            done
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # Záloha za nespolehlivý GitHub cron: po každém běhu počká 8 min; pokud mezitím nezačal jiný běh (cron/push/ruční),
  # spustí export sám. Výsledek: ≥ 1 aktualizace za ~10 min, bez duplicit (pod limitem Pages ~10 nasazení/h).
  keepalive:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}", ME: "${{ github.run_id }}" }
        run: |
          sleep 480
          newer=$(gh run list -R "$R" -w pages.yml -L 5 --json databaseId,createdAt --jq "[.[]|select(.databaseId > $ME)]|length")
          if [ "$newer" -gt 0 ]; then echo "mezitím začal jiný běh – bez zálohy"; else gh workflow run pages.yml -R "$R"; echo "spuštěn další export"; fi
