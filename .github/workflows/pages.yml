name: Predikce -> GitHub Pages
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub Pages má měkký limit ~10 nasazení/h; živé skóre jde z prohlížeče
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  # Push a plánovaný refresh jsou dvě fronty. GitHub jinak zruší čekající push,
  # jakmile se do stejné skupiny zařadí cron, i když je cancel-in-progress false.
  group: pages-${{ github.event_name == 'push' && 'push' || 'refresh' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Obnovit poslední celý model a state.json
        uses: actions/cache/restore@v4
        with:
          path: data/online-cache
          key: model-last-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            model-last-
      - name: Model z release, jinak záloha z cache
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/fetch_release.py
      - run: python scripts/export_static.py
      - id: gate
        name: Push vždy nasadí, starší refresh ne
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          fetch_ok=true
          origin=""
          if [ "$EVENT" != "push" ]; then
            if git fetch origin main; then
              origin=$(git rev-parse origin/main)
              echo "origin/main $origin checkout $SHA"
            else
              fetch_ok=false
              echo "fetch origin/main selhal, refresh se nasadí"
            fi
          fi
          if python scripts/deploy_gate.py "$EVENT" "$SHA" "$origin" "$fetch_ok"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "starší checkout, bez webu, bez state a bez deploy"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.deploy == 'true'
        with: { path: dist }
      - name: Uložit zálohu modelu a state.json
        id: save_cache
        if: success() && steps.gate.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/online-cache
          key: model-last-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Smazat starší zálohy modelu
        if: steps.save_cache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: model-last-${{ github.run_id }}-${{ github.run_attempt }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Maže jen starší běh. Novější záloha (vyšší run id) musí přežít, když se dva exporty potkají.
          ME="${{ github.run_id }}"
          gh cache list -R "$R" --key model-last- --limit 100 --json id,key --jq '.[] | "\(.id)\t\(.key)"' |
            while IFS="$(printf '\t')" read -r id key; do
              num="${key#model-last-}"
              num="${num%%-*}"
              case "$num" in ''|*[!0-9]*) continue ;; esac
              [ "$num" -lt "$ME" ] || continue
              gh cache delete "$id" -R "$R" || true
            done
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # Záloha za nespolehlivý GitHub cron: po každém běhu počká 8 min; pokud mezitím nezačal jiný běh (cron/push/ruční),
  # spustí export sám. Výsledek: ≥ 1 aktualizace za ~10 min, bez duplicit (pod limitem Pages ~10 nasazení/h).
  keepalive:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}", ME: "${{ github.run_id }}" }
        run: |
          sleep 480
          busy=$(gh run list -R "$R" -w pages.yml -L 20 --json databaseId,status --jq "[.[]|select(.databaseId != ($ME|tonumber) and (.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\" or .status==\"requested\"))]|length")
          if [ "$busy" != "0" ]; then echo "jiný běh pages.yml ještě čeká nebo běží – bez zálohy"; else gh workflow run pages.yml -R "$R"; echo "spuštěn další export"; fi
