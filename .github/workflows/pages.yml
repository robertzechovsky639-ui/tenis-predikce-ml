name: Predikce -> GitHub Pages
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub Pages má měkký limit ~10 nasazení/h; živé skóre jde z prohlížeče
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Model + průběžné výsledky z release "model"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download model -p model.tar.gz -R "${{ github.repository }}"
          tar xzf model.tar.gz -C data/model
          mkdir -p data/raw && (gh release download model -p live_results.csv -D data/raw -R "${{ github.repository }}" || true)
      - run: python scripts/export_static.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # Záloha za nespolehlivý GitHub cron: po každém běhu počká 8 min; pokud mezitím nezačal jiný běh (cron/push/ruční),
  # spustí export sám. Výsledek: ≥ 1 aktualizace za ~10 min, bez duplicit (pod limitem Pages ~10 nasazení/h).
  keepalive:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}", ME: "${{ github.run_id }}" }
        run: |
          sleep 480
          newer=$(gh run list -R "$R" -w pages.yml -L 5 --json databaseId,createdAt --jq "[.[]|select(.databaseId > $ME)]|length")
          if [ "$newer" -gt 0 ]; then echo "mezitím začal jiný běh – bez zálohy"; else gh workflow run pages.yml -R "$R"; echo "spuštěn další export"; fi
