name: Predikce -> GitHub Pages
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub Pages má měkký limit ~10 nasazení/h; živé skóre jde z prohlížeče
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Model + průběžné výsledky z release "model"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download model -p model.tar.gz -R "${{ github.repository }}"
          tar xzf model.tar.gz -C data/model
          mkdir -p data/raw && (gh release download model -p live_results.csv -D data/raw -R "${{ github.repository }}" || true)
      - run: python scripts/export_static.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # Záloha, když GitHub plánovač (cron) nespouští: jen pokud poslední plánovaný běh je starší než 30 min,
  # počká 8 min a spustí export znovu (≈ 1 běh / 10 min, pod limitem Pages ~10 nasazení/h). Jakmile cron běží, smyčka se sama zastaví.
  keepalive:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          last=$(gh run list -R "$R" -w pages.yml -e schedule -L 1 --json createdAt --jq '.[0].createdAt // ""')
          now=$(date +%s); age=999999; [ -n "$last" ] && age=$(( now - $(date -d "$last" +%s) ))
          echo "poslední plánovaný běh: ${last:-nikdy} (${age}s)"
          if [ "$age" -gt 1800 ]; then sleep 480; gh workflow run pages.yml -R "$R"; echo "znovu spuštěno"; else echo "cron funguje – bez zálohy"; fi
