name: Predikce -> GitHub Pages
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub spouští nejčastěji po 5 min (v praxi často se zpožděním)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Model z release "model"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download model -p model.tar.gz -R "${{ github.repository }}"
          tar xzf model.tar.gz -C data/model
      - run: python scripts/export_static.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
